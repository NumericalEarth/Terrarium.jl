name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    # don't run if any of these labels are present
    if: >
      !(  
      contains(github.event.pull_request.labels.*.name, 'skip-ci')
      )
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Julia 1.10 compiles the fused surface kernels much more slowly (about 2 h for the suite versus
        # 25 min on 1.12), so it only runs on pushes to main, i.e. after a PR is merged
        version: ${{ github.event_name == 'push' && fromJSON('["1.10", "1.12"]') || fromJSON('["1.12"]') }}
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}